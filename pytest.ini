[pytest]
# pytest.ini
# ==========
# المسار: pytest.ini (جذر المشروع)
# الوظيفة: إعدادات pytest للمشروع

DJANGO_SETTINGS_MODULE = config.settings.testing

python_files = test_*.py tests.py
python_classes = Test*
python_functions = test_*

# أضف مسارات الـ tests
testpaths = tests

# عرض verbose output
addopts =
    --verbose
    --tb=short
    --no-header
    -p no:warnings

# markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    api: marks tests as API tests
    tenant_isolation: marks tests for tenant isolation
